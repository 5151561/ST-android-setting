name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

# 同一分支/PR 有新推送时，取消旧的运行，省 CI 额度
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch submodules
        # 拉取 SillyTavern 与 TauriTavern 子模块以供契约校验与 Rust JNI 构建使用；
        # 优先按指定路径浅拉，若子模块路径变更则回退初始化全部声明子模块。
        run: |
          git submodule update --init --depth 1 SillyTavern external/tauritavern || git submodule update --init --depth 1

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Strip machine-specific org.gradle.java.home
        # gradle.properties 里的 java.home 是开发机专用绝对路径，
        # CI 上不存在，删掉后 Gradle 改用上一步装好的 JDK（JAVA_HOME）。
        run: sed -i '/^org\.gradle\.java\.home/d' gradle.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew test --stacktrace --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
